name: Wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win_amd64
            os: windows-latest
          - platform: darwin_arm64
            os: macos-26
          - platform: darwin_x86_64
            os: macos-15-intel
          - platform: linux_x86_64
            os: ubuntu-24.04
          - platform: linux_aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip wheel --no-build-isolation --no-deps -w wheelhouse .
      - name: Install and smoke
        run: |
          python -c "import glob,subprocess,sys; wheel,=glob.glob('wheelhouse/*.whl'); subprocess.check_call([sys.executable,'-m','pip','install',wheel])"
          python -m pip check
          python -I ci/verify_installed.py ${{ matrix.platform }}
          python -I ci/smoke_local.py
      - name: Verify retry, site, connect deadline and H2 early-response boundaries
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          python -m pip install 'PySocks==1.7.1'
          bash "$GITHUB_WORKSPACE/ci/verify_request_boundaries.sh"
      - name: Exercise the built native candidate before uploading it
        if: matrix.platform == 'linux_aarch64' || matrix.platform == 'darwin_x86_64'
        shell: bash
        working-directory: ${{ runner.temp }}
        env:
          RUYIHTTP_TEST_NATIVE_H3: '1'
          SLOT: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then export PATH="$(brew --prefix openssl@3)/bin:$PATH"; fi
          python -m pip install 'aioquic==1.3.0' 'PySocks==1.7.1'
          python -I "$GITHUB_WORKSPACE/ci/smoke_native_target.py" "$SLOT"
          python -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_http3_native.py -v
          python "$GITHUB_WORKSPACE/ci/smoke_proxy_chain.py"
          python "$GITHUB_WORKSPACE/ci/smoke_h2_close.py"
      - uses: actions/upload-artifact@v4
        with:
          name: ruyihttp-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
