name: Wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win_amd64
            os: windows-latest
          - platform: darwin_arm64
            os: macos-26
          - platform: linux_x86_64
            os: ubuntu-24.04
          - platform: linux_aarch64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip wheel --no-build-isolation --no-deps -w wheelhouse .
      - name: Install and smoke
        run: |
          python -c "import glob,subprocess,sys; wheel,=glob.glob('wheelhouse/*.whl'); subprocess.check_call([sys.executable,'-m','pip','install',wheel])"
          python -m pip check
          python -I ci/verify_installed.py ${{ matrix.platform }}
          python -I ci/smoke_local.py
      - uses: actions/upload-artifact@v4
        with:
          name: ruyihttp-${{ matrix.platform }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
