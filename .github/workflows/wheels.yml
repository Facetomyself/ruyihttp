name: Wheels

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Qualify all release wheels or just one verified native target
        default: all
        options: [all, win_amd64, linux_x86_64, linux_aarch64, darwin_arm64, darwin_x86_64]

permissions:
  contents: read

jobs:
  wheel:
    name: ${{ matrix.platform }}
    runs-on: ${{ fromJSON('{"win_amd64":"windows-2025","linux_x86_64":"ubuntu-24.04","linux_aarch64":"ubuntu-24.04-arm","darwin_arm64":"macos-26","darwin_x86_64":"macos-15-intel"}')[matrix.platform] }}
    # Modern two-endpoint upgrades plus exact-wheel CPython on native Bullseye.
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["win_amd64","darwin_arm64","darwin_x86_64","linux_x86_64","linux_aarch64"]') }}
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: ${{ (endsWith(matrix.platform, 'aarch64') || endsWith(matrix.platform, 'arm64')) && 'arm64' || 'x64' }}
      - name: Build and identify one wheel for both endpoints
        id: build
        shell: bash
        run: |
          mkdir -p native-evidence
          git rev-parse HEAD | tee native-evidence/commit.txt
          python -B tools/build_native.py --check
          python -m pip wheel --no-deps -w wheelhouse .
          python -B tools/build_native.py --inspect-wheel wheelhouse/*.whl --platform '${{ matrix.platform }}' | tee native-evidence/wheel.json
      - name: Verify exact Windows upstream inputs and typed exports
        if: runner.os == 'Windows'
        run: python -B tools/sync_windows_native.py --check-slot
      - name: Reconstruct the previous POSIX distribution from its exact commit
        if: runner.os != 'Windows'
        shell: bash
        env:
          BASELINE: ea44f8fe4468bbee80996e4e73745d6d53c072cc
        run: |
          set -euo pipefail
          old="$RUNNER_TEMP/ruyihttp-previous"
          git init -q "$old/source"
          git -C "$old/source" fetch --depth=1 --no-tags https://github.com/Facetomyself/ruyihttp.git "$BASELINE"
          git -C "$old/source" checkout -q --detach FETCH_HEAD
          test "$(git -C "$old/source" rev-parse HEAD)" = "$BASELINE"
          python -m pip wheel --no-deps -w "$old/wheels" "$old/source"
          echo "RUYIHTTP_PREVIOUS_BUILD=$old" >> "$GITHUB_ENV"
      - name: Prepare the pinned previous fork for an in-place 0.9.1 upgrade
        run: python -I ci/prepare_fork_upgrade.py
      - name: Get the exact public v0.9.2 Release wheel, without rebuilding it
        shell: bash
        run: |
          set -euo pipefail
          python -I ci/release_inputs.py fork-0.9.2 '${{ matrix.platform }}' "$RUNNER_TEMP/ruyihttp-release-092"
          python -c "import os, pathlib; print('RUYIHTTP_RELEASE_092_DIR='+str(pathlib.Path(os.environ['RUNNER_TEMP'])/'ruyihttp-release-092'), file=open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8'))"
      - name: Fetch immutable public v0.9.3 for ordinary upgrades
        shell: bash
        run: |
          set -euo pipefail
          python -I ci/release_inputs.py fork-0.9.3 '${{ matrix.platform }}' "$RUNNER_TEMP/ruyihttp-release-093"
          python -c "import os, pathlib; print('RUYIHTTP_RELEASE_093_DIR='+str(pathlib.Path(os.environ['RUNNER_TEMP'])/'ruyihttp-release-093'), file=open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8'))"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
          cache: false
      - name: Build the pinned fixed-egress MASQUE interoperability peer
        shell: bash
        working-directory: ci/masque_interop
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          binary="$RUNNER_TEMP/ruyihttp-masque-interop"
          if [[ $RUNNER_OS == Windows ]]; then binary="${binary}.exe"; fi
          go mod download
          go mod verify
          go build -mod=readonly -trimpath -o "$binary" .
          python -c "import os, pathlib, sys; print('RUYIHTTP_MASQUE_GO_FIXTURE='+str(pathlib.Path(sys.argv[1]).resolve(strict=True)), file=open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8'))" "$binary"
      - name: Installed native runtime on CPython 3.10
        run: python -I ci/qualify_wheel.py ${{ matrix.platform }} 3.10 wheelhouse native-evidence
      - uses: actions/setup-python@v5
        id: python314
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          python-version: '3.14'
          architecture: ${{ (endsWith(matrix.platform, 'aarch64') || endsWith(matrix.platform, 'arm64')) && 'arm64' || 'x64' }}
      - name: Installed native runtime on CPython 3.14
        if: ${{ !cancelled() && steps.python314.outcome == 'success' }}
        run: python -I ci/qualify_wheel.py ${{ matrix.platform }} 3.14 wheelhouse native-evidence
      - name: Validate the exact wheels inside native glibc 2.31 environments
        if: ${{ success() && runner.os == 'Linux' }}
        shell: bash
        run: bash ci/linux_floor/run.sh '${{ matrix.platform }}' wheelhouse native-evidence/glibc-2.31
      - name: Select isolated Windows comparison interpreter
        if: ${{ success() && runner.os == 'Windows' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Compare the actual candidate, stock upstream, and preceding release to Firefox on the same Windows runner
        if: ${{ success() && runner.os == 'Windows' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p native-evidence/windows-three-way/official native-evidence/windows-three-way/h2
          python -m pip install -r ci/firefox_reference_requirements.txt
          python ci/firefox_reference_capture.py prepare win_amd64 161 "$RUNNER_TEMP/parity-firefox-161"
          bash ci/firefox_reference_isolate.sh win_amd64 161 "$RUNNER_TEMP/parity-firefox-161" "$PWD/native-evidence/windows-three-way/official" --samples 2
          FIREFOX_REFERENCE_H2_PREFACE=1 bash ci/firefox_reference_isolate.sh win_amd64 161 "$RUNNER_TEMP/parity-firefox-161" "$PWD/native-evidence/windows-three-way/h2" --samples 2
          wheel=(wheelhouse/*.whl)
          python -I ci/compare_windows_wire.py "${wheel[0]}" native-evidence/windows-three-way --official native-evidence/windows-three-way/official/win_amd64-161.json --official-h2 native-evidence/windows-three-way/h2/win_amd64-161.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-evidence-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-evidence/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: verified-ruyihttp-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
