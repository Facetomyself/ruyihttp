name: Wheels

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win_amd64
            os: windows-2025
            arch: x64
          - platform: darwin_arm64
            os: macos-26
            arch: arm64
          - platform: darwin_x86_64
            os: macos-15-intel
            arch: x64
          - platform: linux_x86_64
            os: ubuntu-24.04
            arch: x64
          - platform: linux_aarch64
            os: ubuntu-24.04-arm
            arch: arm64
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_CACHE_DIR: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: ${{ matrix.arch }}
      - name: Build and identify one wheel for both endpoints
        id: build
        shell: bash
        run: |
          mkdir -p native-evidence
          git rev-parse HEAD | tee native-evidence/commit.txt
          python -B tools/build_native.py --check
          python -m pip wheel --no-deps -w wheelhouse .
          python -B tools/build_native.py --inspect-wheel wheelhouse/*.whl --platform '${{ matrix.platform }}' | tee native-evidence/wheel.json
      - name: Installed native runtime on CPython 3.10
        run: python -I ci/qualify_wheel.py ${{ matrix.platform }} 3.10 wheelhouse native-evidence
      - uses: actions/setup-python@v5
        id: python314
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          python-version: '3.14'
          architecture: ${{ matrix.arch }}
      - name: Installed native runtime on CPython 3.14
        if: ${{ !cancelled() && steps.python314.outcome == 'success' }}
        run: python -I ci/qualify_wheel.py ${{ matrix.platform }} 3.14 wheelhouse native-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wheel-evidence-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-evidence/
          if-no-files-found: warn
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: verified-ruyihttp-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 14
