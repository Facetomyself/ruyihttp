name: Official Firefox loopback wire references

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    name: capture / ${{ matrix.slot }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {slot: linux_x86_64, runner: ubuntu-24.04, python_arch: x64}
          - {slot: linux_aarch64, runner: ubuntu-24.04-arm, python_arch: arm64}
          - {slot: darwin_arm64, runner: macos-26, python_arch: arm64}
          - {slot: darwin_x86_64, runner: macos-15-intel, python_arch: x64}
          - {slot: win_amd64, runner: windows-2025, python_arch: x64}
    defaults:
      run:
        shell: bash
    env:
      SLOT: ${{ matrix.slot }}
      PYTHONUTF8: '1'
      PIP_NO_CACHE_DIR: '1'
      HOMEBREW_NO_AUTO_UPDATE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065b  # v5.6.0
        with:
          python-version: '3.12'
          architecture: ${{ matrix.python_arch }}
      - name: Stage capture-only dependencies
        run: |
          gpg --version
          python -m pip install -r ci/firefox_reference_requirements.txt
          python ci/firefox_reference_selftest.py -q
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew list --versions nss || brew install nss
            printf 'FIREFOX_REFERENCE_NSS_CERTUTIL=%s/bin/certutil\n' "$(brew --prefix nss)" >> "$GITHUB_ENV"
          fi
          mkdir -p "$RUNNER_TEMP/firefox-references"
          python -m pip list --format=json > "$RUNNER_TEMP/firefox-references/python-packages.json"
      - name: Acquire and capture Firefox 159.0
        run: |
          python ci/firefox_reference_capture.py prepare "$SLOT" 159 "$RUNNER_TEMP/firefox-159"
          bash ci/firefox_reference_isolate.sh "$SLOT" 159 "$RUNNER_TEMP/firefox-159" "$RUNNER_TEMP/firefox-references"
      - name: Acquire and capture Firefox 160.0
        if: ${{ !cancelled() }}
        run: |
          python ci/firefox_reference_capture.py prepare "$SLOT" 160 "$RUNNER_TEMP/firefox-160"
          bash ci/firefox_reference_isolate.sh "$SLOT" 160 "$RUNNER_TEMP/firefox-160" "$RUNNER_TEMP/firefox-references"
      - name: Acquire and capture Firefox 161.0
        if: ${{ !cancelled() }}
        run: |
          python ci/firefox_reference_capture.py prepare "$SLOT" 161 "$RUNNER_TEMP/firefox-161"
          bash ci/firefox_reference_isolate.sh "$SLOT" 161 "$RUNNER_TEMP/firefox-161" "$RUNNER_TEMP/firefox-references"
      - name: Assemble qualified native slot
        run: python ci/firefox_reference_capture.py merge "$SLOT" "$RUNNER_TEMP/firefox-references"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: official-firefox-wire-${{ matrix.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/firefox-references/*.json
          if-no-files-found: error
          retention-days: 14
