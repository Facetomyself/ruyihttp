name: CI
on: workflow_dispatch
permissions:
  contents: read
jobs:
  win-wire-diagnostic:
    runs-on: windows-2025
    timeout-minutes: 16
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Measure unmodified upstream and both fork wheels
        shell: bash
        run: |
          set -euo pipefail
          python -m pip wheel --no-deps -w "$RUNNER_TEMP/wheels" .
          wheel=("$RUNNER_TEMP"/wheels/*.whl)
          python -I ci/compare_windows_wire.py "${wheel[0]}" "$RUNNER_TEMP/wire-peers"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-wire-peers-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wire-peers/
          retention-days: 14
          if-no-files-found: warn
