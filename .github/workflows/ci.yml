name: CI (branch-only Linux floor dispatch shim)

on:
  workflow_dispatch:
    inputs:
      mode:
        type: string
        default: probe
      platform:
        type: string
        default: all
      endpoint:
        type: string
        default: all
      candidate_run_id:
        type: string
        default: ''
      candidate_attempt:
        type: string
        default: '1'
      artifact_kind:
        type: string
        default: source-native-wheel

permissions:
  contents: read
  actions: read

jobs:
  floor:
    uses: ./.github/workflows/linux-minimum.yml
    with:
      mode: ${{ inputs.mode }}
      platform: ${{ inputs.platform }}
      endpoint: ${{ inputs.endpoint }}
      candidate_run_id: ${{ inputs.candidate_run_id }}
      candidate_attempt: ${{ inputs.candidate_attempt }}
      artifact_kind: ${{ inputs.artifact_kind }}
