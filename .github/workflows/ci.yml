name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Byte-compile
        run: python -m compileall -q ruyihttp tests tools ci
      - name: pyflakes
        run: |
          python -m pip install --quiet pyflakes
          python -m pyflakes ruyihttp tests tools ci

  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-26, ubuntu-24.04]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install .
      - name: Contract tests
        run: python -m unittest discover -s tests -v
      - name: Native manifest check
        run: python tools/build_native.py --check
      - name: Native ABI check
        run: |
          python -m pip install --quiet lief
          python tools/verify_runtime.py
      - name: Local HTTP smoke
        run: python ci/smoke_local.py
