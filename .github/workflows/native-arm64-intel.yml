name: Native candidate (ARM64 Linux, Intel macOS)

on:
  push:
    branches: ['native/arm64-intel-20261124-1321']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-arm64-intel-${{ github.sha }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.slot }}
    runs-on: ${{ matrix.slot == 'linux_aarch64' && 'ubuntu-24.04-arm' || 'macos-15-intel' }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        # Narrow repair runs to a selected architecture via the push commit message.
        slot: ${{ fromJSON(contains(github.event.head_commit.message, '[linux-only]') && '["linux_aarch64"]' || contains(github.event.head_commit.message, '[intel-only]') && '["darwin_x86_64"]' || '["linux_aarch64","darwin_x86_64"]') }}
    env:
      TARGET_ARCH: ${{ matrix.slot == 'linux_aarch64' && 'aarch64' || 'x86_64' }}
      DONOR_COMMIT: f557fcd437aae5f18f313eb330bd3ef50f5fc7df
      FIREFOX_COMMIT: 2887d9de1f69c0e9776413da80e7ba0d1225dd9b
      PIP_NO_CACHE_DIR: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.slot == 'linux_aarch64' && '3.14' || '3.12' }}"
      - name: Record target runner identity
        run: |
          mkdir -p "$RUNNER_TEMP/native-evidence"
          exec > >(tee "$RUNNER_TEMP/native-evidence/runner.txt") 2>&1
          git rev-parse HEAD
          uname -sm
          python -c 'import os, platform, sys; print(sys.version); assert platform.machine() == os.environ["TARGET_ARCH"]'
          df -h "$RUNNER_TEMP"
          rustc -vV
          if [[ $RUNNER_OS == Linux ]]; then getconf GNU_LIBC_VERSION; else sw_vers; xcodebuild -version; fi
      - name: Check slot state
        id: slot
        run: |
          python - "${{ matrix.slot }}" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          state = json.loads(Path('ruyihttp/runtime-manifest.json').read_text())['platforms'][sys.argv[1]]['status']
          assert state in ('ready', 'build-required'), state
          with Path(sys.argv[2]).open('a') as output:
              print(f'ready={str(state == "ready").lower()}', file=output)
          print(f'Slot state: {state}')
          PY
      - name: Fetch pinned public sources
        if: steps.slot.outputs.ready == 'false'
        run: |
          donor="$RUNNER_TEMP/ff-ruyijs"
          git init -q "$donor"
          git -C "$donor" fetch --depth=1 --no-tags https://github.com/cutetailbud/ff-ruyijs.git "$DONOR_COMMIT"
          git -C "$donor" checkout -q --detach FETCH_HEAD
          test "$(git -C "$donor" rev-parse HEAD)" = "$DONOR_COMMIT"
          test "$(git -C "$donor" ls-tree HEAD firefox | awk '{print $3}')" = "$FIREFOX_COMMIT"
          git init -q "$donor/firefox"
          git -C "$donor/firefox" remote add origin https://github.com/mozilla-firefox/firefox.git
          if [[ $RUNNER_OS == Linux ]]; then
            git -C "$donor/firefox" config remote.origin.promisor true
            git -C "$donor/firefox" config remote.origin.partialclonefilter blob:none
            git -C "$donor/firefox" fetch --depth=1 --filter=blob:none --no-tags origin "$FIREFOX_COMMIT"
            git -C "$donor/firefox" sparse-checkout set security/nss nsprpub third_party/rust build/rust
          else
            git -C "$donor/firefox" fetch --depth=1 --no-tags origin "$FIREFOX_COMMIT"
          fi
          git -C "$donor/firefox" -c checkout.workers=0 checkout -q --detach FETCH_HEAD
          test "$(git -C "$donor/firefox" rev-parse HEAD)" = "$FIREFOX_COMMIT"
          { git -C "$donor" log -1 --format='%H %cI %s'; git -C "$donor/firefox" log -1 --format='%H %cI %s'; } > "$RUNNER_TEMP/native-evidence/sources.txt"
          df -h "$RUNNER_TEMP"
      - name: Compile native libraries
        if: steps.slot.outputs.ready == 'false'
        run: |
          ci/build_native_target.sh "${{ matrix.slot }}" "$RUNNER_TEMP/ff-ruyijs" "$RUNNER_TEMP/native-libs" 2>&1 | tee "$RUNNER_TEMP/native-evidence/build.log"
      - name: Stage locally compiled candidate
        if: steps.slot.outputs.ready == 'false'
        run: |
          patch_args=()
          if [[ $RUNNER_OS == macOS ]]; then
            patch_args=(--source-patch native/patches/macos-necko-quic-tls-info.patch)
          fi
          python -B tools/stage_native_candidate.py "${{ matrix.slot }}" "$RUNNER_TEMP/native-libs" \
            --donor "$DONOR_COMMIT" --firefox "$FIREFOX_COMMIT" "${patch_args[@]}" | tee "$RUNNER_TEMP/native-evidence/preflight.txt"
      - name: Verify complete native set and build wheel
        id: candidate
        run: |
          cp "native/${{ matrix.slot }}/"{SHA256SUMS,provenance.json} "$RUNNER_TEMP/native-evidence/"
          python -B tools/build_native.py --check
          python -m pip install 'setuptools>=77' 'wheel>=0.45'
          python -m pip wheel --no-deps --no-build-isolation -w "$RUNNER_TEMP/wheelhouse" .
          python -B tools/build_native.py --inspect-wheel "$RUNNER_TEMP"/wheelhouse/*.whl --platform "${{ matrix.slot }}" > "$RUNNER_TEMP/native-evidence/wheel.json"
      - name: Check Linux manylinux policy
        if: runner.os == 'Linux'
        run: |
          python -m pip install 'auditwheel>=6.4,<7'
          auditwheel show "$RUNNER_TEMP"/wheelhouse/*.whl | tee "$RUNNER_TEMP/native-evidence/auditwheel.txt"
          python - "$RUNNER_TEMP/native-evidence/auditwheel.txt" <<'PY'
          import re, sys
          from pathlib import Path
          report = Path(sys.argv[1]).read_text()
          match = re.search(r'following platform tag:\s+"manylinux_2_(\d+)_aarch64"', report)
          if not match or int(match[1]) > 39:
              raise SystemExit('auditwheel did not establish a compatible arm64 manylinux floor')
          PY
      - uses: actions/setup-python@v5
        if: runner.os == 'Linux'
        with:
          python-version: '3.12'
      - name: Install and exercise wheel on target
        working-directory: ${{ runner.temp }}
        run: |
          python -m venv installed-test
          wheel=(wheelhouse/*.whl)
          installed-test/bin/python -m pip install --prefer-binary "${wheel[0]}[socks]" aioquic
          unset NECKO_CORE_LIBRARY NECKO_QUIC_LIBRARY RUYIHTTP_MACHINE RUYIHTTP_PLATFORM PYTHONPATH LD_LIBRARY_PATH DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH
          if [[ $RUNNER_OS == macOS ]]; then export PATH="$(brew --prefix openssl@3)/bin:$PATH"; fi
          openssl version
          installed-test/bin/python -I "$GITHUB_WORKSPACE/ci/smoke_local.py" | tee native-evidence/http1.txt
          installed-test/bin/python -I "$GITHUB_WORKSPACE/ci/smoke_native_target.py" "${{ matrix.slot }}" | tee native-evidence/native-test.txt
          installed-test/bin/python -I -c 'import pathlib, runpy, sys; ci = pathlib.Path(sys.argv[1]); sys.path.append(str(ci)); runpy.run_path(str(ci / "smoke_h2_close.py"), run_name="__main__")' "$GITHUB_WORKSPACE/ci" | tee native-evidence/h2-eof.txt
      - name: Exercise Intel installed-wheel native H3 and proxy regressions
        if: runner.os == 'macOS'
        timeout-minutes: 6
        working-directory: ${{ runner.temp }}
        run: |
          unset NECKO_CORE_LIBRARY NECKO_QUIC_LIBRARY RUYIHTTP_MACHINE RUYIHTTP_PLATFORM PYTHONPATH LD_LIBRARY_PATH DYLD_LIBRARY_PATH DYLD_FALLBACK_LIBRARY_PATH
          export PATH="$(brew --prefix openssl@3)/bin:$PATH"
          set +e
          RUYIHTTP_TEST_NATIVE_H3=1 installed-test/bin/python -I -m unittest discover -s "$GITHUB_WORKSPACE/tests" -p test_http3_native.py -v 2>&1 | tee native-evidence/full-h3.txt
          h3_status=$?
          installed-test/bin/python -I "$GITHUB_WORKSPACE/ci/smoke_proxy_chain.py" 2>&1 | tee native-evidence/proxy.txt
          proxy_status=$?
          printf 'Full H3 status: %d; proxy status: %d\n' "$h3_status" "$proxy_status"
          (( h3_status == 0 && proxy_status == 0 ))
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.slot }}
          path: ${{ runner.temp }}/native-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure() && steps.candidate.outcome == 'success'
        with:
          name: unverified-diagnostic-wheel-${{ matrix.slot }}
          path: ${{ runner.temp }}/wheelhouse/*.whl
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: verified-native-wheel-${{ matrix.slot }}
          path: ${{ runner.temp }}/wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7
