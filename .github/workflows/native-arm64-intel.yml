name: Native runtime qualification and source candidates

on:
  workflow_dispatch:
    inputs:
      platform:
        type: choice
        description: Native target to exercise
        default: all
        options: [all, linux_aarch64, linux_x86_64, darwin_x86_64, darwin_arm64, win_amd64]
      mode:
        type: choice
        description: Verify tracked libraries or compile POSIX candidates (Windows retains its original runtime)
        default: verify
        options: [verify, rebuild]

permissions:
  contents: read

concurrency:
  group: native-${{ github.sha }}-${{ inputs.platform }}-${{ inputs.mode }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.slot }}
    runs-on: ${{ fromJSON('{"linux_aarch64":"ubuntu-24.04-arm","linux_x86_64":"ubuntu-24.04","darwin_x86_64":"macos-15-intel","darwin_arm64":"macos-26","win_amd64":"windows-2025"}')[matrix.slot] }}
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        slot: ${{ fromJSON(inputs.platform != 'all' && format('["{0}"]', inputs.platform) || (inputs.mode == 'rebuild' && '["linux_aarch64","linux_x86_64","darwin_x86_64","darwin_arm64"]' || '["linux_aarch64","linux_x86_64","darwin_x86_64","darwin_arm64","win_amd64"]')) }}
    env:
      TARGET_ARCH: ${{ fromJSON('{"linux_aarch64":"aarch64","linux_x86_64":"x86_64","darwin_x86_64":"x86_64","darwin_arm64":"arm64","win_amd64":"amd64"}')[matrix.slot] }}
      PYTHON_ARCH: ${{ (endsWith(matrix.slot, 'aarch64') || endsWith(matrix.slot, 'arm64')) && 'arm64' || 'x64' }}
      PYTHONUTF8: '1'
      DONOR_COMMIT: f557fcd437aae5f18f313eb330bd3ef50f5fc7df
      FIREFOX_COMMIT: 2887d9de1f69c0e9776413da80e7ba0d1225dd9b
      PIP_NO_CACHE_DIR: '1'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: ${{ env.PYTHON_ARCH }}
      - name: Record target runner identity
        run: |
          mkdir -p "$RUNNER_TEMP/native-evidence"
          exec > >(tee "$RUNNER_TEMP/native-evidence/runner.txt") 2>&1
          git rev-parse HEAD
          uname -sm
          python -c 'import os, platform, sys; print(sys.version); assert platform.machine().lower() == os.environ["TARGET_ARCH"]'
          df -h "$RUNNER_TEMP"
          rustc -vV
          if [[ $RUNNER_OS == Linux ]]; then
            getconf GNU_LIBC_VERSION
          elif [[ $RUNNER_OS == macOS ]]; then
            sw_vers
            xcodebuild -version
            cpu=$(sysctl -n machdep.cpu.brand_string)
            translated=$(sysctl -in sysctl.proc_translated || true)
            printf 'CPU: %s; Rosetta translation: %s\n' "$cpu" "${translated:-0}"
            [[ ${translated:-0} == 0 ]]
            if [[ $TARGET_ARCH == x86_64 ]]; then [[ $cpu == *Intel* ]]; else [[ $cpu == *Apple* ]]; fi
          fi
      - name: Isolate the old native set for a source rebuild
        if: inputs.mode == 'rebuild'
        env:
          SLOT: ${{ matrix.slot }}
        run: |
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          slot = os.environ['SLOT']
          if slot not in {'linux_aarch64', 'linux_x86_64', 'darwin_x86_64', 'darwin_arm64'}:
              raise SystemExit('unknown native target')
          root = Path(os.environ['GITHUB_WORKSPACE']).resolve(strict=True)
          assert Path.cwd().resolve() == root
          src = root / 'native' / slot
          assert src.resolve(strict=True) == src and src.is_dir() and not src.is_symlink()
          # Dedicated hosted runner only. Keep the original bytes in a separate
          # directory; the artifact job has a read-only repository credential.
          temp = Path(os.environ['RUNNER_TEMP']).resolve(strict=True)
          saved = temp / ('tracked-native-' + slot)
          assert saved.resolve() == saved and not saved.exists() and root not in saved.parents
          src.rename(saved)
          src.mkdir()
          if (saved / 'README.md').is_file():
              shutil.copy2(saved / 'README.md', src / 'README.md')
          fp = root / 'ruyihttp' / 'runtime-manifest.json'
          doc = json.loads(fp.read_text(encoding='utf-8'))
          doc['platforms'][slot].update(status='build-required', files={})
          fp.write_text(json.dumps(doc, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Check slot state
        id: slot
        run: |
          python - "${{ matrix.slot }}" "$GITHUB_OUTPUT" <<'PY'
          import json, sys
          from pathlib import Path
          state = json.loads(Path('ruyihttp/runtime-manifest.json').read_text())['platforms'][sys.argv[1]]['status']
          assert state in ('ready', 'build-required'), state
          with Path(sys.argv[2]).open('a') as output:
              print(f'ready={str(state == "ready").lower()}', file=output)
          print(f'Slot state: {state}')
          PY
      - name: Fetch pinned public sources
        if: steps.slot.outputs.ready == 'false'
        run: |
          retry_fetch() {
            local checkout=$1 attempt
            shift
            for attempt in 1 2 3; do
              if git -C "$checkout" -c http.version=HTTP/1.1 -c http.lowSpeedLimit=1024 \
                  -c http.lowSpeedTime=60 fetch --depth=1 --no-tags "$@"; then
                return 0
              fi
              printf 'Pinned fetch attempt %s/3 failed\n' "$attempt" >&2
              if [[ $attempt != 3 ]]; then sleep "$((5 * attempt))"; fi
            done
            return 128
          }
          donor="$RUNNER_TEMP/ff-ruyijs"
          git init -q "$donor"
          retry_fetch "$donor" https://github.com/cutetailbud/ff-ruyijs.git "$DONOR_COMMIT"
          git -C "$donor" checkout -q --detach FETCH_HEAD
          test "$(git -C "$donor" rev-parse HEAD)" = "$DONOR_COMMIT"
          test "$(git -C "$donor" ls-tree HEAD firefox | awk '{print $3}')" = "$FIREFOX_COMMIT"
          git init -q "$donor/firefox"
          git -C "$donor/firefox" remote add origin https://github.com/mozilla-firefox/firefox.git
          if [[ $RUNNER_OS == Linux ]]; then
            git -C "$donor/firefox" config remote.origin.promisor true
            git -C "$donor/firefox" config remote.origin.partialclonefilter blob:none
            retry_fetch "$donor/firefox" --filter=blob:none origin "$FIREFOX_COMMIT"
            git -C "$donor/firefox" sparse-checkout set security/nss nsprpub third_party/rust build/rust
          else
            retry_fetch "$donor/firefox" origin "$FIREFOX_COMMIT"
          fi
          git -C "$donor/firefox" -c checkout.workers=0 checkout -q --detach FETCH_HEAD
          test "$(git -C "$donor/firefox" rev-parse HEAD)" = "$FIREFOX_COMMIT"
          { git -C "$donor" log -1 --format='%H %cI %s'; git -C "$donor/firefox" log -1 --format='%H %cI %s'; } > "$RUNNER_TEMP/native-evidence/sources.txt"
          df -h "$RUNNER_TEMP"
      - name: Compile native libraries
        if: steps.slot.outputs.ready == 'false'
        run: |
          ci/build_native_target.sh "${{ matrix.slot }}" "$RUNNER_TEMP/ff-ruyijs" "$RUNNER_TEMP/native-libs" 2>&1 | tee "$RUNNER_TEMP/native-evidence/build.log"
      - name: Stage locally compiled candidate
        if: steps.slot.outputs.ready == 'false'
        run: |
          patch_args=()
          if [[ $RUNNER_OS == macOS ]]; then
            patch_args=(--source-patch native/patches/macos-necko-quic-tls-info.patch)
          fi
          patch_args+=(--source-patch native/patches/h3-body-abi-v1.patch)
          python -B tools/stage_native_candidate.py "${{ matrix.slot }}" "$RUNNER_TEMP/native-libs" \
            --donor "$DONOR_COMMIT" --firefox "$FIREFOX_COMMIT" "${patch_args[@]}" | tee "$RUNNER_TEMP/native-evidence/preflight.txt"
      - name: Stamp a unique source-candidate wheel version
        if: steps.slot.outputs.ready == 'false'
        run: python -I ci/stamp_native_candidate.py "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
      - name: Verify complete native set and build wheel
        id: candidate
        run: |
          slot="native/${{ matrix.slot }}"
          for file in "$slot"/{SHA256SUMS,provenance.json,exports.json}; do
            if [[ -f "$file" ]]; then cp "$file" "$RUNNER_TEMP/native-evidence/"; fi
          done
          cp ruyihttp/runtime-manifest.json "$RUNNER_TEMP/native-evidence/runtime-manifest.json"
          python -B tools/build_native.py --check
          python -m pip install 'setuptools>=77' 'wheel>=0.45'
          python -m pip wheel --no-deps --no-build-isolation -w "$RUNNER_TEMP/wheelhouse" .
          python -B tools/build_native.py --inspect-wheel "$RUNNER_TEMP"/wheelhouse/*.whl --platform "${{ matrix.slot }}" > "$RUNNER_TEMP/native-evidence/wheel.json"
      - name: Check Linux manylinux policy
        if: runner.os == 'Linux'
        run: |
          python -m pip install 'auditwheel>=6.4,<7'
          auditwheel show "$RUNNER_TEMP"/wheelhouse/*.whl | tee "$RUNNER_TEMP/native-evidence/auditwheel.txt"
          python - "$RUNNER_TEMP/native-evidence/auditwheel.txt" "$TARGET_ARCH" <<'PY'
          import re, sys
          from pathlib import Path
          report = Path(sys.argv[1]).read_text()
          match = re.search(r'following platform tag:\s+"manylinux_2_(\d+)_' + sys.argv[2] + '"', report)
          if not match or int(match[1]) > 39:
              raise SystemExit('auditwheel did not establish a compatible target manylinux floor')
          PY
      - name: Qualify installed runtime on CPython 3.14
        env:
          RUYIHTTP_REQUIRE_H3_BODY_ABI: ${{ steps.slot.outputs.ready == 'false' && '1' || '0' }}
        run: python -I ci/qualify_wheel.py "${{ matrix.slot }}" 3.14 "$RUNNER_TEMP/wheelhouse" "$RUNNER_TEMP/native-evidence"
      - uses: actions/setup-python@v5
        id: python310
        if: ${{ !cancelled() && steps.candidate.outcome == 'success' }}
        with:
          python-version: '3.10'
          architecture: ${{ env.PYTHON_ARCH }}
      - name: Qualify installed runtime on CPython 3.10
        if: ${{ !cancelled() && steps.python310.outcome == 'success' }}
        env:
          RUYIHTTP_REQUIRE_H3_BODY_ABI: ${{ steps.slot.outputs.ready == 'false' && '1' || '0' }}
        run: python -I ci/qualify_wheel.py "${{ matrix.slot }}" 3.10 "$RUNNER_TEMP/wheelhouse" "$RUNNER_TEMP/native-evidence"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-evidence-${{ matrix.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-evidence/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure() && steps.candidate.outcome == 'success'
        with:
          name: unverified-diagnostic-wheel-${{ matrix.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wheelhouse/*.whl
          if-no-files-found: ignore
          retention-days: 3
      - uses: actions/upload-artifact@v4
        with:
          name: verified-native-wheel-${{ matrix.slot }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 7
